<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÉchoBulle — hublot hypnotique</title>
    <script type="importmap">
      {
        "imports": {
          "mediabunny": "./vendor/mediabunny.js"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #06070b;
        --fg: #eef0f6;
        --accent: #7ad2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 20% 15%, #101727, #06070b 55%);
        color: var(--fg);
        font-family: "Inter", "SF Pro Text", system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .shell {
        width: min(780px, 100%);
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .text-pad {
        width: min(760px, 100%);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 16px;
        padding: 12px 14px 10px;
        display: grid;
        gap: 10px;
      }

      .text-pad textarea {
        width: 100%;
        min-height: 64px;
        background: rgba(0, 0, 0, 0.24);
        color: var(--fg);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
        resize: vertical;
        outline: none;
      }

      .text-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .hashtags-line {
        min-height: 22px;
        color: rgba(255, 255, 255, 0.78);
        letter-spacing: 0.02em;
        font-size: 13px;
        word-break: break-word;
      }

      .viewport {
        width: min(72vw, 520px);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.6), inset 0 0 80px rgba(122, 210, 255, 0.08);
        background: linear-gradient(145deg, #070a12, #0f1520);
        position: relative;
      }

      #echo-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: var(--fg);
        background: linear-gradient(135deg, rgba(122, 210, 255, 0.22), rgba(255, 255, 255, 0.04));
        padding: 12px 16px;
        border-radius: 999px;
        letter-spacing: 0.03em;
        font-size: 14px;
        cursor: pointer;
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
        border-color: rgba(255, 255, 255, 0.36);
        box-shadow: 0 12px 40px rgba(122, 210, 255, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      .hint {
        font-size: 12px;
        opacity: 0.76;
        text-align: center;
        max-width: 540px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="text-pad">
        <textarea
          id="thought-input"
          placeholder="J’écris ici les pensées qui déambullent•° dans mon esprit..."
          aria-label="Pensées à pulvériser en hashtags"
        ></textarea>
        <div class="text-actions">
          <button id="tag-pulse">l’écho des #</button>
          <div class="hashtags-line" id="hashtags-line"></div>
        </div>
      </div>
      <div class="viewport" aria-label="Hublot audiovisuel" id="viewport">
        <canvas id="echo-canvas"></canvas>
      </div>
      <div class="controls">
        <button id="import-audio">Importer MP3</button>
        <button id="import-visual">Importer visuels</button>
        <button id="capture">Capture PNG</button>
        <button id="reset-all">Stop / Reset</button>
      </div>
      <div class="hint">
        Le hublot respire avec des bulles contours : emojis résonant avec tes hashtags, tags qui apparaissent l’un après l’autre,
        GIFs générés depuis tes visuels importés. Un MP3 en boucle nourrit le pulse. Tap ou clique pour souffler : une danse lente
        et lisible.
      </div>
    </div>

    <input id="file-audio" type="file" accept="audio/mpeg" hidden />
    <input id="file-visual" type="file" accept="image/png,image/jpeg,video/mp4,video/webm" hidden />

    <script type="module" src="./main.js"></script>
  </body>
</html>
